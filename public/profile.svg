<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <rect width="400" height="500" fill="#ded5c5"/>
  <!-- Dot matrix background pattern -->
  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#2b2723" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="url(#dotGrid)"/>

  <!-- Character Pixel Silhouette -->
  <!-- Hair / Cap -->
  <rect x="130" y="90" width="140" height="40" fill="#2b2723"/>
  <rect x="120" y="110" width="160" height="40" fill="#2b2723"/>
  <rect x="110" y="130" width="30" height="70" fill="#2b2723"/>
  <rect x="260" y="130" width="30" height="70" fill="#2b2723"/>

  <!-- Face Skin -->
  <rect x="140" y="130" width="120" height="110" fill="#fbcfe8"/>
  <rect x="130" y="150" width="140" height="70" fill="#fbcfe8"/>

  <!-- Pixel Eyes (Glasses / Shades) -->
  <rect x="140" y="160" width="45" height="25" fill="#2b2723"/>
  <rect x="215" y="160" width="45" height="25" fill="#2b2723"/>
  <rect x="185" y="168" width="30" height="8" fill="#2b2723"/>
  <!-- Glint in glasses -->
  <rect x="145" y="165" width="10" height="8" fill="#38bdf8"/>
  <rect x="220" y="165" width="10" height="8" fill="#38bdf8"/>

  <!-- Smile -->
  <rect x="180" y="215" width="40" height="8" fill="#2b2723"/>
  <rect x="175" y="210" width="10" height="8" fill="#2b2723"/>
  <rect x="215" y="210" width="10" height="8" fill="#2b2723"/>

  <!-- Neck & Collar -->
  <rect x="175" y="240" width="50" height="30" fill="#fbcfe8"/>
  
  <!-- Hoodie / Clothes -->
  <rect x="100" y="270" width="200" height="180" fill="#ea580c"/>
  <rect x="120" y="260" width="160" height="20" fill="#ea580c"/>
  <rect x="170" y="270" width="60" height="180" fill="#2b2723"/>
  <!-- BINUS CS Badge on chest -->
  <rect x="225" y="310" width="55" height="25" fill="#fffdf9" stroke="#2b2723" stroke-width="2"/>
  <text x="252" y="327" font-family="monospace" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">BINUS</text>

  <!-- Bottom Tape Indicator -->
  <rect x="40" y="440" width="320" height="36" fill="#fffdf9" stroke="#2b2723" stroke-width="3"/>
  <text x="200" y="463" font-family="monospace" font-size="12" font-weight="bold" fill="#2b2723" text-anchor="middle">★ ARTHURS_OPERATOR.AVATAR ★</text>
</svg>

